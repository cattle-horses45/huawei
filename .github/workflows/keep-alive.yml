name: Keep Render Server Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://huawei-chatbot.onrender.com/api/health)
          echo "Ping response: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "Server is alive!"
          else
            echo "Warning: Server returned $response"
          fi
